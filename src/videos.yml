"Box slice":
  desc: 'The evolution the gas density from redshift z = 17.5 to z = 0 of a 10 comoving megaparsec (cMpc) thick slice through the L050m6 simulation, which is 50 cMpc on a side (1 cMpc is about 3.3/(1+z) million lightyears). The sonification for this video is in stereo, which sound in the left (right) speaker coming from the left (right) side of the side. See <a href="videos_box.html" class="active text-decoration-none">this gallery</a> for the evolution of more properties in this box slice.'
  name: box_slice.mp4

"Sonification explanation":
  name: sonification_explainer.mp4
  desc: 'The COLIBRE videos include sonification using <a href="https://joss.theoj.org/papers/10.21105/joss.07875" class="active text-decoration-none">STRAUSS</a> to augment what is seen. Sound is used to express the black hole accretion rate, the star formation and the energy outflow rate of galaxies as they evolve. These use rhythmic, musical and textural representations, respectively, to distinguish them. Watch the (accessible) explainer video below to understand more.'


