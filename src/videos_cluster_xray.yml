page_description: '<p>
Below are videos showing the evolution of X-rays within the 
largest cluster in the L050m6 simulation. This object has a present-day
virial mass of 10<sup>14.2</sup> M<sub>⊙</sub> and the central
galaxy has a stellar mass of 10<sup>11.6</sup> M<sub>⊙</sub>.
</p>'

