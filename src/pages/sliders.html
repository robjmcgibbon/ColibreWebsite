<html>
<head>
<style>
* {box-sizing: border-box;}

/* New styles for layout */
.main-container {
  display: flex; /* Makes it a flex container */
  align-items: flex-start; /* Aligns items to the start (top) of the cross axis */
  gap: 40px; /* Adds space between the image viewer and the controls */
  padding: 20px; /* Some padding around the whole section */
  flex-wrap: wrap; /* Allows items to wrap to the next line on smaller screens */
  justify-content: center; /* Center horizontally if space allows */
}

.controls-container {
  display: flex;
  flex-direction: column; /* Stack dropdowns vertically */
  gap: 20px; /* Space between each dropdown section */
  padding: 15px;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  background-color: #fdfdfd;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.button-container { /* Renamed this from "button-container" for clarity, but keeping original for now */
  /* This still styles each individual dropdown section */
  margin-bottom: 0; /* Remove default margin from the previous layout */
  text-align: left; /* Align text within each dropdown section */
}

.button-container h3 {
    margin-top: 0;
    margin-bottom: 10px;
    color: #333;
}

.button-container select {
    padding: 8px 12px;
    border-radius: 4px;
    border: 1px solid #ccc;
    font-size: 16px;
    cursor: pointer;
    background-color: #fff;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.075);
}

/* Existing styles */
.img-comp-container {
  position: relative;
  height: 800px; /*should be the same height as the images*/
  /* Ensure this has a defined width, or it will collapse */
  width: 800px; /* Set a fixed width for the image viewer */
}

.img-comp-img {
  position: absolute;
  width: auto;
  height: auto;
  overflow:hidden;
}

.img-comp-img img {
  display:block;
}

.img-comp-slider {
  position: absolute;
  z-index: 9;
  cursor: ew-resize;
  width: 40px;
  height: 40px;
  background-color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid black; /* Black outline */
  font-size: 20px; /* Size for arrows */
  font-weight: bold;
  color: black; /* Color of arrows */
  user-select: none; /* Prevent selection */
}

.img-comp-slider::before {
  content: "< >"; /* Arrows inside */
  font-family: Arial, sans-serif;
}

.img-comp-white-bar {
  position: absolute;
  width: 2px;
  height: 100%;
  background-color: white;
  top: 0;
  z-index: 8; /* Ensure the bar is behind the slider circle */
}

</style>

<body>

<h1 style="text-align: center;">Individual Galaxies</h1>

<!-- FIRST SLIDER SECTION -->
<div class="main-container">
    <div class="img-comp-container" id="slider1">
        <div class="img-comp-img">
            <img src="slider_images/galaxy_2083215_map_gri_faceon.png" width="800" height="800">
        </div>
        <div class="img-comp-img img-comp-overlay">
            <img src="slider_images/galaxy_2083215_map_HI_faceon.png" width="800" height="800">
        </div>
    </div>


    <div class="controls-container">
        <div class="button-container">
            <h3>Galaxy ID</h3>
            <select onchange="setGalaxyId('slider1', this)">
                <option value="2083215" selected>Galaxy 2083215</option>
                <option value="1234567">Galaxy 1234567</option>
                <option value="7654321">Galaxy 7654321</option>
            </select>
        </div>

        <div class="button-container">
            <h3>Left Image</h3>
            <select onchange="setLeftImage('slider1', this)">
                <option value="gri">Show Stars</option>
                <option value="HI" selected>Show HI</option>
                <option value="H2">Show H2</option>
                <option value="dust">Show dust</option>
                <option value="metal">Show metals</option>
                <option value="sfr">Show SFR</option>
            </select>
        </div>

        <div class="button-container">
            <h3>Right Image</h3>
            <select onchange="setRightImage('slider1', this)">
                <option value="gri" selected>Show Stars</option>
                <option value="HI">Show HI</option>
                <option value="H2">Show H2</option>
                <option value="dust">Show dust</option>
                <option value="metal">Show metals</option>
                <option value="sfr">Show SFR</option>
            </select>
        </div>

        <div class="button-container">
            <h3>Select orientation</h3>
            <select onchange="setOrientation('slider1', this)">
                <option value="faceon" selected>Face on</option>
                <option value="edgeon">Edge on</option>
            </select>
        </div>
    </div>
</div>

<h1 style="text-align: center;">Box slices</h1>

<!-- SECOND SLIDER SECTION -->
<div class="main-container">
    <div class="img-comp-container" id="slider2">
        <div class="img-comp-img">
            <img src="slider_images/L25m6_dm_mass.png" width="800" height="800">
        </div>
        <div class="img-comp-img img-comp-overlay">
            <img src="slider_images/L25m6_gas_mass.png" width="800" height="800">
        </div>
    </div>

    <div class="controls-container">
        <div class="button-container">
            <h3>Galaxy ID</h3>
            <select onchange="setGalaxyId('slider2', this)">
                <option value="2083215" selected>Galaxy 2083215</option>
                <option value="1234567">Galaxy 1234567</option>
                <option value="7654321">Galaxy 7654321</option>
            </select>
        </div>

        <div class="button-container">
            <h3>Left Image</h3>
            <select onchange="setLeftImage('slider2', this)">
                <option value="gri">Show Stars</option>
                <option value="HI" selected>Show HI</option>
                <option value="H2">Show H2</option>
                <option value="dust">Show dust</option>
                <option value="metal">Show metals</option>
                <option value="sfr">Show SFR</option>
            </select>
        </div>

        <div class="button-container">
            <h3>Right Image</h3>
            <select onchange="setRightImage('slider2', this)">
                <option value="gri" selected>Show Stars</option>
                <option value="HI">Show HI</option>
                <option value="H2">Show H2</option>
                <option value="dust">Show dust</option>
                <option value="metal">Show metals</option>
                <option value="sfr">Show SFR</option>
            </select>
        </div>

        <div class="button-container">
            <h3>Select orientation</h3>
            <select onchange="setOrientation('slider2', this)">
                <option value="faceon" selected>Face on</option>
                <option value="edgeon">Edge on</option>
            </select>
        </div>
    </div>
</div>

<script>
const state = {
    slider1: { galaxyId: '2083215', leftType: 'HI', rightType: 'gri', orientation: 'faceon' },
    slider2: { galaxyId: '2083215', leftType: 'HI', rightType: 'gri', orientation: 'faceon' }
};

function setGalaxyId(sliderId, selectElement) {
    state[sliderId].galaxyId = selectElement.value;
    updateImage(sliderId);
}

function setLeftImage(sliderId, selectElement) {
    state[sliderId].leftType = selectElement.value;
    updateImage(sliderId);
}

function setRightImage(sliderId, selectElement) {
    state[sliderId].rightType = selectElement.value;
    updateImage(sliderId);
}

function setOrientation(sliderId, selectElement) {
    state[sliderId].orientation = selectElement.value;
    updateImage(sliderId);
}

function updateImage(sliderId) {
    const container = document.getElementById(sliderId);
    const leftImg = container.querySelector('.img-comp-overlay img');
    const rightImg = container.querySelector('.img-comp-img:first-child img');

    const { galaxyId, leftType, rightType, orientation } = state[sliderId];
    leftImg.src = `slider_images/galaxy_${galaxyId}_map_${leftType}_${orientation}.png`;
    rightImg.src = `slider_images/galaxy_${galaxyId}_map_${rightType}_${orientation}.png`;
}

function compare() {
    const overlays = document.getElementsByClassName("img-comp-overlay");
    for (let i = 0; i < overlays.length; i++) {
        compareImages(overlays[i]);
    }

    function compareImages(img) {
        let slider, clicked = 0, w = img.offsetWidth, h = img.offsetHeight;
        img.style.width = (w / 2) + "px";

        slider = document.createElement("DIV");
        slider.setAttribute("class", "img-comp-slider");
        img.parentElement.insertBefore(slider, img);

        const whiteBar = document.createElement("DIV");
        whiteBar.setAttribute("class", "img-comp-white-bar");
        img.parentElement.insertBefore(whiteBar, img);

        slider.style.top = (h * 0.9 - slider.offsetHeight / 2) + "px";
        slider.style.left = (w / 2 - slider.offsetWidth / 2) + "px";
        whiteBar.style.left = (w / 2 - 1) + "px";

        slider.addEventListener("mousedown", slideReadyDesktop);
        slider.addEventListener("touchstart", slideReadyMobile, { passive: false });

        function slideReadyDesktop(e) {
            e.preventDefault();
            clicked = 1;
            window.addEventListener("mousemove", slideMove);
            window.addEventListener("mouseup", slideFinish);
        }

        function slideReadyMobile(e) {
            e.preventDefault();
            clicked = 1;
            window.addEventListener("touchmove", slideMove, { passive: false });
            window.addEventListener("touchend", slideFinish);
        }

        function slideFinish() {
            clicked = 0;
            window.removeEventListener("mousemove", slideMove);
            window.removeEventListener("mouseup", slideFinish);
            window.removeEventListener("touchmove", slideMove);
            window.removeEventListener("touchend", slideFinish);
        }

        function slideMove(e) {
            if (clicked === 0) return;
            let pos = getCursorPos(e);
            if (pos < 0) pos = 0;
            if (pos > w) pos = w;
            slide(pos);
        }

        function getCursorPos(e) {
            let x = 0;
            e = e.changedTouches ? e.changedTouches[0] : e;
            const rect = img.getBoundingClientRect();
            x = e.pageX - rect.left - window.pageXOffset;
            return x;
        }

        function slide(x) {
            img.style.width = x + "px";
            slider.style.left = img.offsetWidth - (slider.offsetWidth / 2) + "px";
            whiteBar.style.left = x + "px";
        }
    }
}

compare();
</script>

</body>


</html>
