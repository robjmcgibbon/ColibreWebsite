    desc: "Evolution of radial velocity on large scales alongside stellar light"
  radial_velocities_stellar_light_thermal_small.mp4:
    desc: "Evolution of radial velocity on small scales alongside stellar light"
  radial_velocities_thermal_large.mp4:
