page_description: '<p>
Below are videos showing the evolution of the entropy within the 
largest cluster in the L050m6 simulation. This object has a present-day
virial mass of 10<sup>14.2</sup> M<sub>⊙</sub> and the central
galaxy has a stellar mass of 10<sup>11.6</sup> M<sub>⊙</sub>.
</p>'

"Thermal AGN feedback":
  entropies_stellar_light_thermal_large.mp4:
    desc: "Evolution of entropy on large scales alongside stellar light"
  entropies_stellar_light_thermal_small.mp4:
    desc: "Evolution of entropy on small scales alongside stellar light"
  entropies_thermal_large.mp4:
    desc: "Evolution of entropy on large scales"
  entropies_thermal_small.mp4:
    desc: "Evolution of entropy on small scales"

"Hybrid AGN feedback":
  entropies_stellar_light_hybrid_large.mp4:
    desc: "Evolution of entropy on large scales alongside stellar light"
  entropies_stellar_light_hybrid_small.mp4:
    desc: "Evolution of entropy on small scales alongside stellar light"
  entropies_hybrid_large.mp4:
    desc: "Evolution of entropy on large scales"
  entropies_hybrid_small.mp4:
    desc: "Evolution of entropy on small scales"

"AGN feedback comparison":
