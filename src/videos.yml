# Key should be the title of the videoname of file
# name (of file within videos directory) is required
# desc is optional

"Individual galaxy":
  name: barred_starlight_newmix.mp4
  desc: 'The evolution of a galaxy in the L012m5 simulation from redshift z = 5.5 to z = 0. The galaxy has a present-day stellar mass of 10<sup>10.8</sup> M<sub>⊙</sub>, a star formation rate of 1.6 M<sub>⊙</sub>/yr, and a black hole of mass 10<sup>8.2</sup> M<sub>⊙</sub>. For another galaxy, more properties, and videos without sonification, see <a href="videos_galaxy_barred.html" class="active text-decoration-none">the video gallery for galaxy 1</a> or <a href="videos_galaxy_merger.html" class="active text-decoration-none">the video gallery for galaxy 2</a>. The top left scale bar indicates a length of 10 physical kiloparsec (pkpc), which is about 32.6 thousand lightyears.'

"Cluster of galaxies":
  desc: 'The evolution of the largest cluster in the L050m6 simulation from redshift z = 10 to z = 0. This object has a present-day virial mass of 10<sup>14.2</sup> M<sub>⊙</sub>. The central galaxy has a stellar mass of 10<sup>11.6</sup> M<sub>⊙</sub> and a supermassive black hole with a mass of 10<sup>9.6</sup> M<sub>⊙</sub>. The left panel shows stellar light, the right shows gas density. The scale bar indicates a length of 500 physical kiloparsec (pkpc), which is about 1.6 million lightyears. Videos are also available for the following properties:
  <a href="videos_cluster_densities.html" class="active text-decoration-none">Gas density</a>,
  <a href="videos_cluster_entropies.html" class="active text-decoration-none">Gas entropy</a>,
  <a href="videos_cluster_metal_masses.html" class="active text-decoration-none">Gas metallicity</a>,
  <a href="videos_cluster_radial_velocities.html" class="active text-decoration-none">Radial velocities</a>,
  <a href="videos_cluster_temperatures.html" class="active text-decoration-none">Gas temperature</a>,
  <a href="videos_cluster_stellar_light.html" class="active text-decoration-none">Stellar light</a>,
  <a href="videos_cluster_stellar_light_no_dust.html" class="active text-decoration-none">Unattenuated stellar light</a>,
  <a href="videos_cluster_velocity_divergences.html" class="active text-decoration-none">Velocity divergence</a>,
  and <a href="videos_cluster_xray.html" class="active text-decoration-none">X-rays</a>.
  '

