title: 'Galaxy 1 Video'
page_description: '<p>
Below are videos showing the evolution of a galaxy in the L012m5 simulation from redshift z = 5.5 to z = 0.
It has present-day stellar mass 10<sup>10.8</sup> M<sub>⊙</sub>, a star formation rate of 1.6 M<sub>⊙</sub>/yr, 
and a black hole of mass 10<sup>8.2</sup> M<sub>⊙</sub>.
Different videos show different properties (stellar light with dust attenuation, various gas properties, dark matter density).
</p>'

"Galaxy-scale view":
  barred_starlight_newmix.mp4:
    desc: "Stellar light with inset showing larger scales"
    name_nosound: barred_starlight_newmix_nosound.mp4
  barred_gallery_newmix.mp4:
    desc: "Stellar light, three different projections"
    name_nosound: barred_gallery_newmix_nosound.mp4
  barred_twoprop_dust_v_int_newmix.mp4:
    desc: "Stellar light (dust attenuated), stellar light (intrinsic)"
    name_nosound: barred_twoprop_dust_v_int_newmix_nosound.mp4
  barred_multirow_newmix.mp4:
    desc: "Stellar light, gas density, HI density, dark matter density, H_2 density, dust density (x100)"
    name_nosound: barred_multirow_newmix_nosound.mp4
  barred_zoomcomp_small_newmix.mp4:
    desc: "Stellar light, gas density, dark matter density (galaxy scale)"
    name_nosound: barred_zoomcomp_small_newmix_nosound.mp4
  barred_twoprop_newmix.mp4:
    desc: "Stellar light, gas density (galaxy-scale)"
    name_nosound: barred_twoprop_newmix_nosound.mp4

