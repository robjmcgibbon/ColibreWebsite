    desc: "Evolution of velocity divergence on large scales alongside stellar light"
  velocity_divergences_stellar_light_thermal_small.mp4:
    desc: "Evolution of velocity divergence on small scales alongside stellar light"
  velocity_divergences_thermal_large.mp4:
