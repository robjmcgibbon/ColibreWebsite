    desc: "Evolution of stellar light on large scales alongside stellar light"
  HST_no_dust_stellar_light_thermal_small.mp4:
    desc: "Evolution of stellar light on small scales alongside stellar light"
  HST_no_dust_thermal_large.mp4:
