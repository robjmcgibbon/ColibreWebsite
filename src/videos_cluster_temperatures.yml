    desc: "Evolution of temperature on large scales alongside stellar light"
  temperatures_stellar_light_thermal_small.mp4:
    desc: "Evolution of temperature on small scales alongside stellar light"
  temperatures_thermal_large.mp4:
    desc: "Evolution of temperature on large scales"
  temperatures_thermal_small.mp4:
    desc: "Evolution of temperature on small scales"

