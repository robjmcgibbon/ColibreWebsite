page_description: '<p>
Below are videos showing the evolution of the gas density within the 
largest cluster in the L050m6 simulation. This object has a present-day
virial mass of 10<sup>14.2</sup> M<sub>⊙</sub> and the central
galaxy has a stellar mass of 10<sup>11.6</sup> M<sub>⊙</sub>.
</p>'

"Thermal AGN feedback":
  densities_stellar_light_thermal_large.mp4:
    desc: "Evolution of gas density on large scales alongside stellar light"
  densities_stellar_light_thermal_small.mp4:
    desc: "Evolution of gas density on small scales alongside stellar light"
  densities_thermal_large.mp4:
    desc: "Evolution of gas density on large scales"
  densities_thermal_small.mp4:
    desc: "Evolution of gas density on small scales"

"Hybrid AGN feedback":
