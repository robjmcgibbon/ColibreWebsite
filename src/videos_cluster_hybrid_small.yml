page_description: "<p>
Below are videos showing the evolution of the 
largest cluster of galaxies in the L050m6h simulation (hybrid AGN feedback). This object has a present-day
virial mass of 10<sup>14.2</sup> M<sub>⊙</sub>. The central
galaxy has a stellar mass of 10<sup>11.6</sup> M<sub>⊙</sub> and a supermassive black hole with a mass of 10<sup>9.6</sup> M<sub>⊙</sub>.
The scale bar indicates a length of 100 physical kiloparsec (pkpc),
which is about 300 thousand lightyears.
</p>"

