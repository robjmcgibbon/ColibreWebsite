# Top-level data for videos.html: the overall page intro, the ordering of
# sections on the page/sidebar. Each section is either:
# - an interactive selector, with "data" naming the yml file (under src/) that
#   defines it (see videos_cluster.yml/videos_box.yml/videos_galaxy.yml for
#   that schema) and "key" giving the short section id used in generated
#   ids/urls/JSON, or
# - a standalone single video (e.g. "Sonification explanation"), with "name"
#   (the video filename) and "desc".
# See make_video_page() in make_webpage.py for the dispatch logic - adding a
# new section only requires an entry here plus its data file, no code changes.

page_description: "This page contains videos showing the evolution of
an individual galaxy, a cluster of galaxies, a slice through the simulation,
and an explanation of the sonification process. Use the controls in each
section to explore the different models, scales, and properties available."

"Individual galaxy":
  data: videos_galaxy.yml
  key: galaxy

"Cluster of galaxies":
  data: videos_cluster.yml
  key: cluster

"Box slice":
  data: videos_box.yml
  key: box

"Sonification explanation":
  name: sonification_explainer.mp4
  desc: "The COLIBRE videos include sonification using <a href='https://joss.theoj.org/papers/10.21105/joss.07875' class='active text-decoration-none'>STRAUSS</a> to augment what is seen. Sound is used to express the black hole accretion rate, the star formation and the energy outflow rate of galaxies as they evolve. These use rhythmic, musical and textural representations, respectively, to distinguish them. Watch the (accessible) explainer video below to understand more."
