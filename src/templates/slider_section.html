<div class="main-container d-flex flex-wrap align-items-start">
    <div>
        <div class="text-center mb-3 responsive-text-container">
            <h2 id="sec%SLIDER_ID%" style="text-align: center;">%SECTION_TITLE%</h2>
            <p>%DESCRIPTION%</p>
        </div>

        <div class="img-comp-container%CONTAINER_CLASS%" id="slider%SLIDER_ID%">
            <div class="img-comp-img">
                <img %INITIAL_RIGHT_IMG%>
                <video %INITIAL_RIGHT_VIDEO% muted playsinline preload="auto"></video>
            </div>
            <div class="img-comp-img img-comp-overlay">
                <img %INITIAL_LEFT_IMG%>
                <video %INITIAL_LEFT_VIDEO% muted playsinline preload="auto"></video>
            </div>
        </div>
    </div>
    <div class="controls-wrapper">
        <div class="controls-spacer"></div>
        <div class="controls-container">
          %BUTTONS%
        <a href="%INITIAL_LEFT_DOWNLOAD%" id="hires_left%SLIDER_ID%">Download<br>left %DOWNLOAD_TYPE%</a>
        <a href="%INITIAL_RIGHT_DOWNLOAD%" id="hires_right%SLIDER_ID%">Download<br>right %DOWNLOAD_TYPE%</a>
        </div>
    </div>
</div>
