page_description: '<p>
Below are two sets of videos showing the evolution of two different 
galaxies in the L012m5 simulation from redshift z = 5.5 to z = 0. 
Galaxies 1 and 2 have present-day stellar masses of 10<sup>10.8</sup> M<sub>⊙</sub> and 10<sup>10.5</sup> M<sub>⊙</sub>, respectively. 
Towards the end of the simulation these two galaxies are interacting with each other. 
Different videos show different properties (stellar light with dust attenuation, various gas properties, dark matter density).

<br><br>

The COLIBRE videos include sonification using <a href="https://joss.theoj.org/papers/10.21105/joss.07875" class="active text-decoration-none">STRAUSS</a> to augment what is seen.
Sound is used to express the black hole accretion rate, the star formation and the energy outflow rate of galaxies as they evolve.
These use rhythmic, musical and textural representations, respectively, to distinguish them. Watch the (accessible) <a href="#sec3" class="active text-decoration-none">explainer 
video</a> to understand more.

<br><br>

The videos are still being improved and more will be added, so please keep an eye on this page.
</p>'

# NOTE: The page_description above assumes that the explainer video is part of section 3

