# Interactive video selector data for the "Box slice" section of videos.html.
# See videos_cluster.yml for the full schema explanation.

axes: [model, property]

description: "Below are videos showing the evolution of various properties from
  redshift z = 17.5 to z = 0 of a 10 comoving megaparsec (cMpc) thick slice through
  the L050m6 simulations, which are 50 cMpc on a side (1 cMpc is about 3.3/(1+z)
  million lightyears). The sonification for this video is in stereo, with sound in
  the left (right) speaker coming from the left (right) side of the slice."

default: {model: thermal, property: metallicity}

model:
  label: "Model"
  options:
    - key: thermal
      label: "Thermal AGN feedback"
    - key: hybrid
      label: "Hybrid AGN feedback"

property:
  label: "Property"
  options:
    - key: log_temperature
      label: "Temperature"
    - key: gas_mass
      label: "Gas density"
    - key: metallicity
      label: "Gas metallicity"
    - key: stellar_mass
      label: "Stellar density"
