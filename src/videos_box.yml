title: 'Box Slice Video'
page_description: '<p>
Below are videos showing the evolution of the L050m6 simulation.
One set shows a simulation with the thermal AGN model, another
shows the hybrid AGN model. All show a 10cMpc slice.
Different videos show different properties.
</p>'
# TODO: Update to sonified videos
# Sonification is stereo, so headphones are recommended.

