# Key should be the title of the videoname of file
# name (of file within videos directory) is required
# desc is optional

# NOTE: This page description contains hard-coded links
page_description: "This page contains videos showing the evolution of 
<a href='#sec1' class='active text-decoration-none'>an individual galaxy</a>,
<a href='#sec2' class='active text-decoration-none'>a cluster of galaxies</a>,
<a href='#sec3' class='active text-decoration-none'>a slice through the simulation</a>,
and <a href='#sec4' class='active text-decoration-none'>an explanation of the sonification process</a>. There are also links to additional video galleries."

"Individual galaxy":
  name: barred_starlight_newmix.mp4
  desc: "The evolution of a galaxy in the L012m5 simulation from redshift z = 5.5 to z = 0. The galaxy has a present-day stellar mass of 10<sup>10.8</sup> M<sub>⊙</sub>, a star formation rate of 1.6 M<sub>⊙</sub>/yr, and a black hole of mass 10<sup>8.2</sup> M<sub>⊙</sub>. For another galaxy, more properties, and videos without sonification, see <a href='videos_galaxy_barred.html' class='active text-decoration-none'>the video gallery for galaxy 1</a> or <a href='videos_galaxy_merger.html' class='active text-decoration-none'>the video gallery for galaxy 2</a>. The top left scale bar indicates a length of 10 physical kiloparsec (pkpc), which is about 32.6 thousand lightyears."

"Cluster of galaxies":
  name: densities_stellar_light_thermal_large.mp4
  desc: "The evolution of the largest cluster of galaxies in the L050m6 simulation from redshift z = 10 to z = 0. This object has a present-day virial mass of 10<sup>14.2</sup> M<sub>⊙</sub>. The central galaxy has a stellar mass of 10<sup>11.6</sup> M<sub>⊙</sub> and a supermassive black hole with a mass of 10<sup>9.6</sup> M<sub>⊙</sub>. The left panel shows stellar light, the right shows gas density.
    Additional gas properties are also available for simulations of this cluster
    with <a href='videos_cluster_thermal_large.html' class='active text-decoration-none'>the thermal AGN feedback model</a>,
    with <a href='videos_cluster_hybrid_large.html' class='active text-decoration-none'>the hybrid AGN feedback model</a>,
    and with <a href='videos_cluster_compareAGN_large.html' class='active text-decoration-none'>a comparison of AGN feedback models</a>.
    The scale bar indicates a length of 500 physical kiloparsec (pkpc), which is about 1.6 million lightyears.
    "

"Box slice":
  name: video_Thermal_non_equilibrium_metallicity.mp4
  desc: "The evolution of the gas metallicity from redshift z = 17.5 to z = 0 of a 10 comoving megaparsec (cMpc) thick slice through the L050m6 simulation, which is 50 cMpc on a side (1 cMpc is about 3.3/(1+z) million lightyears). The sonification for this video is in stereo, with sound in the left (right) speaker coming from the left (right) side of the slice. See <a href='videos_box.html' class='active text-decoration-none'>this gallery</a> for the evolution of more properties in this box slice with both thermal and hybrid AGN feedback."

"Sonification explanation":
  name: sonification_explainer.mp4
  desc: "The COLIBRE videos include sonification using <a href='https://joss.theoj.org/papers/10.21105/joss.07875' class='active text-decoration-none'>STRAUSS</a> to augment what is seen. Sound is used to express the black hole accretion rate, the star formation and the energy outflow rate of galaxies as they evolve. These use rhythmic, musical and textural representations, respectively, to distinguish them. Watch the (accessible) explainer video below to understand more."


