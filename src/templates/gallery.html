<link rel="stylesheet" href="css/gallery.css">

<h1>%GALLERY_NAME% Gallery</h1>
<div class="modal fade" id="imageModal" aria-hidden="true" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="helptext mt-1 mb-0">Click the image for a full-resolution version</div>
      <div class="modal-body">
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="videoModal" aria-hidden="true" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
      </div>
    </div>
  </div>
</div>

%IMG_SECTIONS%

<script type="text/javascript">
$('#imageModal').on('show.bs.modal', function (event) {
  var link = $(event.relatedTarget);
  var type = link.data('type');
  var src = link.data('src');
  var caption = link.data('caption');
  var modal = $(this);
  modal.find('.modal-title').text(caption);
  var fullsrc = src.substring(0, src.length - 7) + 'full' + src.substring(src.length - 4);
  modal.find('.modal-body').html("<a href=\"" + fullsrc + "\" target=\"_blank\" \
    rel=\"noopener noreferrer\"><img src=\"" + src + "\" /></a>");
});
</script>

<script type="text/javascript">
$('#videoModal').on('show.bs.modal', function (event) {
  var link = $(event.relatedTarget);
  var type = link.data('type');
  var src = link.data('src');
  var caption = link.data('caption');
  var modal = $(this);
  modal.find('.modal-title').text(caption);
  modal.find('.modal-body').html("<video width=\"100%\" height=\"auto\" controls><source src=\"" + src + "\" type=\"video/mp4\">Your browser does not support the video tag.</video>");
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
